<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Carteira de Investimentos</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet"
    >
</head>

<body
    class="flex justify-center items-center min-h-screen px-6 text-emerald-50"
    style="font-family: 'Space Mono', monospace; background: radial-gradient(circle at 20% 0%, #1d4d35 0%, #0b1f16 42%, #050c09 100%);"
>
    <div class="w-full max-w-sm bg-emerald-950/50 backdrop-blur-xl border border-emerald-200/15 rounded-3xl p-8 shadow-[0_0_45px_rgba(52,211,153,0.12)]">

        <div class="mb-7">
            <p class="text-xs uppercase tracking-[0.28em] text-emerald-300/70 mb-2">carteira de investimentos</p>
            <h1 class="text-2xl font-bold text-emerald-50">Bem-vindo de volta</h1>
            <p class="text-sm text-emerald-100/45 mt-2">Acesse sua carteira para acompanhar seus investimentos</p>
        </div>

        <form method="POST" action="/login" class="flex flex-col gap-5">

            <input
                type="text"
                name="username"
                placeholder="nome de usuário"
                required
                autocomplete="username"
                class="w-full px-4 py-3 bg-black/20 border border-emerald-200/15 rounded-xl text-emerald-50 placeholder-emerald-100/30 focus:outline-none focus:border-emerald-400/60 focus:bg-emerald-950/40 focus:shadow-[0_0_15px_rgba(52,211,153,0.18)] transition-all duration-300"
            >

            <input
                type="password"
                name="password"
                placeholder="senha"
                required
                autocomplete="current-password"
                class="w-full px-4 py-3 bg-black/20 border border-emerald-200/15 rounded-xl text-emerald-50 placeholder-emerald-100/30 focus:outline-none focus:border-emerald-400/60 focus:bg-emerald-950/40 focus:shadow-[0_0_15px_rgba(52,211,153,0.18)] transition-all duration-300"
            >

            <button
                type="submit"
                class="px-4 py-3 bg-emerald-400/20 border border-emerald-300/35 rounded-xl text-emerald-200 font-bold hover:bg-emerald-400/30 hover:border-emerald-300/55 hover:shadow-[0_0_22px_rgba(52,211,153,0.25)] active:bg-emerald-400/40 transition-all duration-300"
            >
                Entrar
            </button>

        </form>
    </div>
</body>
</html>
